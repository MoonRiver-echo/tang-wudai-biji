<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>笔记小说 SQL 控制台</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e6e8ee; --dim:#98a0b0; --accent:#6ea8fe; --ok:#63d297; --err:#ff7b72;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
  font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
.app{display:flex; height:100vh}

/* ── 侧栏 ── */
.side{
  width:290px; flex:none; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
}
.brand{padding:14px 16px; border-bottom:1px solid var(--line)}
.brand h1{margin:0; font-size:15px; letter-spacing:.5px}
.brand small{color:var(--dim); font-size:12px}
.side-scroll{overflow:auto; padding:10px 12px 20px; flex:1}
.side h2{
  font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--dim); margin:16px 0 8px; font-weight:600;
}
.tbl{margin-bottom:6px}
.tbl-head{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:6px 8px; border-radius:6px; cursor:pointer; user-select:none;
}
.tbl-head:hover{background:var(--panel2)}
.tbl-name{font-weight:600; color:var(--accent)}
.tbl-rows{color:var(--dim); font-size:12px}
.cols{display:none; padding:2px 0 6px 12px; border-left:2px solid var(--line); margin-left:8px}
.cols.open{display:block}
.col{
  display:flex; justify-content:space-between; gap:8px; padding:2px 6px;
  border-radius:4px; cursor:pointer; font-size:12.5px;
}
.col:hover{background:var(--panel2)}
.col .t{color:var(--dim); font-size:11px}
.col .pk{color:var(--ok)}
.sample{
  display:block; width:100%; text-align:left; background:var(--panel2);
  color:var(--fg); border:1px solid var(--line); border-radius:6px;
  padding:7px 9px; margin-bottom:6px; cursor:pointer; font-size:12.5px;
}
.sample:hover{border-color:var(--accent); color:var(--accent)}

/* ── 主区 ── */
.main{flex:1; display:flex; flex-direction:column; min-width:0}
.editor-wrap{border-bottom:1px solid var(--line); background:var(--panel)}
textarea{
  width:100%; height:190px; resize:vertical; border:0; outline:0;
  background:var(--panel); color:var(--fg); padding:14px 16px;
  font:13.5px/1.7 "Cascadia Code",Consolas,"Courier New",monospace;
  tab-size:2;
}
.bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 14px; background:var(--panel2); border-top:1px solid var(--line);
}
button{
  background:var(--accent); color:#0d1117; border:0; border-radius:6px;
  padding:7px 15px; font-weight:600; cursor:pointer; font-size:13px;
}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.5; cursor:default}
button.ghost{background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500}
button.ghost:hover{border-color:var(--accent); color:var(--accent); filter:none}
label.chk{display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--dim); font-size:12.5px}
label.chk input{accent-color:var(--err); cursor:pointer}
.hint{color:var(--dim); font-size:12px; margin-left:auto}
.status{padding:8px 14px; font-size:12.5px; min-height:34px; border-bottom:1px solid var(--line)}
.status.ok{color:var(--ok)}
.status.err{color:var(--err); white-space:pre-wrap; font-family:Consolas,monospace}

/* ── 结果表 ── */
.result{flex:1; overflow:auto; position:relative}
table{border-collapse:collapse; width:max-content; min-width:100%; font-size:13px}
th,td{
  border:1px solid var(--line); padding:6px 10px; text-align:left;
  vertical-align:top; max-width:620px;
}
th{
  background:var(--panel2); position:sticky; top:0; z-index:2;
  font-weight:600; white-space:nowrap; color:var(--accent);
}
td{white-space:pre-wrap; word-break:break-word}
tbody tr:nth-child(even){background:rgba(255,255,255,.022)}
tbody tr:hover{background:rgba(110,168,254,.09)}
td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
td.null{color:var(--dim); font-style:italic}
.rowno{color:var(--dim); text-align:right; font-size:11.5px; white-space:nowrap}
.empty{padding:40px; text-align:center; color:var(--dim)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>笔记小说 SQL 控制台</h1>
      <small>{{ db_name }}</small>
    </div>
    <div class="side-scroll">
      <h2>常用查询</h2>
      <div id="samples">
        {% for title, sql in samples %}
        <button class="sample" data-sql="{{ sql|e }}">{{ title }}</button>
        {% endfor %}
      </div>
      <div style="margin:10px 0 0; padding:8px 10px; background:var(--panel2);
                  border-left:2px solid var(--accent); border-radius:4px;
                  color:var(--dim); font-size:12px; line-height:1.55">
        中文检索建议用 <code style="color:var(--accent)">LIKE '%词%'</code>（全库仅 4204 段，约 7ms）。
        <code style="color:var(--accent)">paragraphs_fts</code> 用 trigram 分词，
        只能匹配 <b>3 字及以上</b>的关键词。
      </div>
      <h2>数据表</h2>
      <div id="schema"><div style="color:var(--dim)">加载中…</div></div>
    </div>
  </aside>

  <main class="main">
    <div class="editor-wrap">
      <textarea id="sql" spellcheck="false" placeholder="在此输入 SQL，Ctrl+Enter 执行…"></textarea>
      <div class="bar">
        <button id="run">执行 (Ctrl+Enter)</button>
        <button id="export" class="ghost">导出 CSV</button>
        <button id="clear" class="ghost">清空</button>
        <label class="chk"><input type="checkbox" id="writable">允许写入 (UPDATE/INSERT/DELETE)</label>
        <span class="hint">点击左侧表名展开字段，点字段名可插入</span>
      </div>
    </div>
    <div class="status" id="status">就绪。默认只读连接，最多返回 2000 行。</div>
    <div class="result" id="result">
      <div class="empty">执行查询后，结果会显示在这里。</div>
    </div>
  </main>
</div>
<script src="/static/console.js"></script>
</body>
</html>
